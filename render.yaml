# Render Blueprint: a static site served straight from the repo root (no build step).
services:
  - type: web
    name: spacegame-site
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    headers:
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
